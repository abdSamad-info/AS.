<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Background Badge Container -->
  <rect width="100" height="100" rx="24" fill="#08090e"/>
  <rect x="3" y="3" width="94" height="94" rx="21" stroke="url(#favicon-border-grad)" stroke-width="3.5" fill="none"/>
  
  <defs>
    <linearGradient id="favicon-border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3d5afe"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#00e5ff"/>
    </linearGradient>

    <linearGradient id="favicon-cyan-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <!-- Left / Right Code Brackets -->
  <path d="M 19 32 L 9 50 L 19 68" stroke="url(#favicon-border-grad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
  <path d="M 81 32 L 91 50 L 81 68" stroke="url(#favicon-border-grad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>

  <!-- LETTER 'A' - Crisp White Apex -->
  <path d="M 26 70 L 40 26 L 52 70" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Crossbar -->
  <path d="M 31 54 L 47 54" stroke="url(#favicon-cyan-grad)" stroke-width="6" stroke-linecap="round"/>

  <!-- LETTER 'S' - Distinct Cyan Curve -->
  <path d="M 74 36 C 74 26 58 26 58 37 C 58 47 74 48 74 60 C 74 71 57 71 55 64" stroke="url(#favicon-cyan-grad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Cyan Node Dot -->
  <circle cx="76" cy="68" r="3" fill="#00e5ff"/>
</svg>
